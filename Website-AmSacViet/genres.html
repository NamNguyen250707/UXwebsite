<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="genres.meta.title">Loại hình âm nhạc | Âm Sắc Việt</title>
  <meta name="description" data-i18n-content="genres.meta.desc"
        content="Bản đồ 16 loại hình âm nhạc truyền thống Việt Nam, 10 được UNESCO ghi danh, kèm ảnh, mô tả và video biểu diễn.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.className += " js";</script>

  <script defer src="app.js"></script>
</head>
<body data-page="genres" id="top">

  <div id="site-header"></div>

  <main id="main" tabindex="-1">

    <!-- Đầu trang -->
    <section class="page-head has-deco" aria-labelledby="genres-title">
      <!-- Hoa văn: vòng trống đồng lấp ló góc phải, ba con hạc bên trái -->
      <div class="sec-deco" aria-hidden="true">
        <img class="deco-drum deco-drum-head" src="assets/motif-vong-trong-dong.svg" alt="">
      </div>
      <div class="container">
        <h1 id="genres-title" class="page-title" data-i18n="genres.title">Các loại hình âm nhạc</h1>
        <p class="section-lead" data-i18n="genres.lead">16 loại hình: 10 được UNESCO ghi danh, 6 loại hình tiêu biểu khác.</p>

        <!-- Nút lọc theo vùng (genres.js gắn sự kiện) -->
        <div class="filter-bar" role="group" aria-label="Lọc theo vùng" data-i18n-aria-label="genres.filter.label">
          <span class="filter-label" aria-hidden="true" data-i18n="genres.filter.short">Vùng</span>
          <button type="button" class="filter-btn" data-region="all" aria-pressed="true" data-i18n="genres.filter.all">Tất cả</button>
          <button type="button" class="filter-btn" data-region="north" aria-pressed="false" data-i18n="region.north">Bắc Bộ</button>
          <button type="button" class="filter-btn" data-region="central" aria-pressed="false" data-i18n="region.central">Trung Bộ</button>
          <button type="button" class="filter-btn" data-region="highlands" aria-pressed="false" data-i18n="region.highlands">Tây Nguyên</button>
          <button type="button" class="filter-btn" data-region="south" aria-pressed="false" data-i18n="region.south">Nam Bộ</button>
        </div>
        <!-- Lọc theo nhóm: UNESCO ghi danh / loại hình khác (genres.js gắn sự kiện) -->
        <div class="filter-bar filter-bar-group" role="group" aria-label="Lọc theo nhóm" data-i18n-aria-label="genres.group.label">
          <span class="filter-label" aria-hidden="true" data-i18n="genres.group.short">Nhóm</span>
          <button type="button" class="filter-btn" data-group="all" aria-pressed="true" data-i18n="genres.filter.all">Tất cả</button>
          <button type="button" class="filter-btn" data-group="unesco" aria-pressed="false" data-i18n="genres.group.unesco">UNESCO ghi danh</button>
          <button type="button" class="filter-btn" data-group="other" aria-pressed="false" data-i18n="genres.group.other">Loại hình khác</button>
        </div>
        <p class="filter-count" id="filterCount" aria-live="polite"></p>
        <p class="visually-hidden" id="genreLive" aria-live="polite"></p>
      </div>
    </section>

    <!-- Bản đồ + khung chi tiết -->
    <section class="section pt-0">
      <div class="container">
        <div class="row g-4 align-items-start">
          <div class="col-lg-5">
            <div class="asv-card map-card">
              <!-- genres.js vẽ bản đồ (SVG) và các nút đánh dấu vào đây -->
              <div class="map-wrap" id="mapWrap"></div>
              <!-- Chú thích hai kiểu điểm trên bản đồ -->
              <ul class="map-legend">
                <li><span class="map-dot" aria-hidden="true"></span><span data-i18n="genres.legend.unesco">Được UNESCO ghi danh</span></li>
                <li><span class="map-dot is-other" aria-hidden="true"></span><span data-i18n="genres.legend.other">Loại hình tiêu biểu khác</span></li>
              </ul>
              <p class="map-source" data-i18n="genres.map.source">Đường biên: Natural Earth. Chấm nhỏ ở cuối đường nối là vị trí thật.</p>
            </div>
          </div>
          <div class="col-lg-7">
            <!-- Khung chi tiết: đổi theo điểm đang chọn -->
            <article class="asv-card genre-panel" id="genrePanel" tabindex="-1"></article>
            <div class="genre-media" id="genreMedia"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Danh sách thẻ (cho người không dùng bản đồ) -->
    <section class="section pt-0 has-deco" aria-labelledby="list-title">
      <div class="sec-deco" aria-hidden="true">
        <img class="deco-hac deco-l1" src="assets/motif-hac.svg" alt="">
        <img class="deco-hac deco-l2" src="assets/motif-hac.svg" alt="">
        <img class="deco-hac deco-l3" src="assets/motif-hac.svg" alt="">
      </div>
      <div class="container">
        <h2 id="list-title" class="section-title" data-i18n="genres.list.title">Tất cả loại hình</h2>
        <div class="row g-4" id="genreList"></div>
      </div>
    </section>

    <!-- Xem tiếp -->
    <section id="explore-next" data-next="instruments,history"></section>
  </main>

  <div id="site-footer"></div>

  <noscript>
    <p class="container py-3" style="color:#9E2A1C">Trang cần bật JavaScript để hiện bản đồ, phát âm thanh và đổi ngôn ngữ. / Please enable JavaScript to see the map, play sounds and switch languages.</p>
  </noscript>
</body>
</html>
