<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <!-- Hoa văn nền cho các trang con: hạc, sen, nốt nhạc, đàn nguyệt — kiểu chạm nổi.
       Mẹo chạm nổi: mỗi họa tiết vẽ 3 lớp:
         1. lớp sáng lệch lên trái  (ánh sáng chiếu vào mép trên)
         2. lớp tối lệch xuống phải (bóng đổ của mép dưới)
         3. lớp chính cùng tông nền, nằm trên cùng
       Màu rất gần màu giấy để chữ phía trên vẫn đạt tương phản 4.5:1.
       Ô 560×560 lặp lại; mọi họa tiết nằm trọn trong ô để không bị cắt ở mép. -->
  <defs>
    <!-- Hạc bay -->
    <g id="hac">
      <path d="M-8 -6 C-2 -40 20 -58 44 -62 C34 -44 26 -24 14 -6Z"/>
      <path d="M-4 -4 C-20 -26 -14 -44 2 -54 C4 -34 6 -18 6 -4Z"/>
      <ellipse cx="0" cy="0" rx="22" ry="8"/>
      <path d="M18 -3 L34 -7 L31 5Z"/>
      <path fill="none" stroke-width="3.5" stroke-linecap="round" d="M-18 -3 Q-36 -14 -50 -8"/>
      <circle cx="-52" cy="-9" r="4.5"/>
      <path d="M-55 -11 L-70 -5 L-55 -6Z"/>
      <path fill="none" stroke-width="2" stroke-linecap="round" d="M18 2 L52 9 M18 4 L50 12"/>
    </g>
    <!-- Hoa sen và lá -->
    <g id="sen">
      <path fill="none" stroke-width="3" stroke-linecap="round" d="M0 0 C3 16 -2 32 1 50"/>
      <path d="M1 50 m-34 8 a34 12 0 1 0 68 0 a34 12 0 1 0 -68 0z"/>
      <path d="M0 0 C-18 -2 -34 -12 -40 -26 C-26 -22 -12 -14 0 0Z"/>
      <path d="M0 0 C18 -2 34 -12 40 -26 C26 -22 12 -14 0 0Z"/>
      <path d="M0 0 C-18 -10 -26 -30 -21 -46 C-11 -36 -4 -20 0 0Z"/>
      <path d="M0 0 C18 -10 26 -30 21 -46 C11 -36 4 -20 0 0Z"/>
      <path d="M0 0 C-10 -18 -8 -38 0 -54 C8 -38 10 -18 0 0Z"/>
    </g>
    <!-- Hai nốt móc đơn nối nhau -->
    <g id="not-doi">
      <ellipse cx="0" cy="0" rx="9" ry="6.5" transform="rotate(-22)"/>
      <ellipse cx="30" cy="-8" rx="9" ry="6.5" transform="rotate(-22 30 -8)"/>
      <path d="M7 -3 h3.5 v-40 h-3.5z M37 -11 h3.5 v-40 h-3.5z"/>
      <path d="M7 -43 L40.5 -51 L40.5 -43 L7 -35Z"/>
    </g>
    <!-- Nốt móc đơn -->
    <g id="not-don">
      <ellipse cx="0" cy="0" rx="9" ry="6.5" transform="rotate(-22)"/>
      <path d="M7 -3 h3.5 v-42 h-3.5z"/>
      <path d="M10.5 -45 C14 -32 28 -30 24 -12 C22 -24 14 -26 10.5 -30Z"/>
    </g>
    <!-- Đàn nguyệt: bầu tròn, cần dài có phím -->
    <g id="dan">
      <circle cx="0" cy="0" r="24"/>
      <path d="M-4 -22 h8 v-74 h-8z"/>
      <path d="M-6 -96 C-6 -108 6 -112 8 -104 L4 -96Z"/>
      <path d="M-9 -88 h6 v4 h-6z M3 -80 h6 v4 h-6z"/>
    </g>
  </defs>

  <rect width="560" height="560" fill="#F5ECD9"/>

  <!-- Lớp 1: sáng; lớp 2: bóng; lớp 3: mặt chính -->
  <g transform="translate(150 120) scale(1.1)">
    <use href="#hac" x="-1.2" y="-1.2" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#hac" x="1.2" y="1.2" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#hac" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
  <g transform="translate(372 78) scale(0.6)">
    <use href="#hac" x="-1.5" y="-1.5" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#hac" x="1.5" y="1.5" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#hac" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
  <g transform="translate(430 230)">
    <use href="#sen" x="-1.2" y="-1.2" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#sen" x="1.2" y="1.2" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#sen" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
  <g transform="translate(118 470) scale(0.72)">
    <use href="#sen" x="-1.5" y="-1.5" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#sen" x="1.5" y="1.5" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#sen" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
  <g transform="translate(290 410) rotate(-10)">
    <use href="#not-doi" x="-1.2" y="-1.2" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#not-doi" x="1.2" y="1.2" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#not-doi" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
  <g transform="translate(82 318) rotate(12) scale(0.9)">
    <use href="#not-don" x="-1.3" y="-1.3" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#not-don" x="1.3" y="1.3" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#not-don" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
  <g transform="translate(262 238) rotate(8) scale(0.7)">
    <use href="#not-don" x="-1.6" y="-1.6" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#not-don" x="1.6" y="1.6" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#not-don" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
  <g transform="translate(470 488) rotate(-35) scale(0.9)">
    <use href="#dan" x="-1.3" y="-1.3" fill="#FFFBF2" stroke="#FFFBF2"/>
    <use href="#dan" x="1.3" y="1.3" fill="#D9C7A3" stroke="#D9C7A3"/>
    <use href="#dan" fill="#EEE1C6" stroke="#EEE1C6"/>
  </g>
</svg>
