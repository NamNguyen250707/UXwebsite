    </pattern>
    <!-- Vân gỗ: các nét mảnh song song như vết khắc -->
    <pattern id="van" width="12" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q3 1.5 6 3 T12 3" fill="none" stroke="#2E2118" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#F1E4C6"/>
  <rect width="400" height="400" fill="url(#diep)"/>
  <ellipse cx="225" cy="368" rx="105" ry="10" fill="#E0CFA9"/>
