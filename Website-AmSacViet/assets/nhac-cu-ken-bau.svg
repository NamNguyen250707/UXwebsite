    <path d="M193 62 L207 62 L214 262 L186 262 Z" fill="url(#van)"/>
    <circle class="l" cx="200" cy="92" r="3.6" fill="#2E2118"/><circle class="l" cx="200" cy="114" r="3.6" fill="#2E2118"/><circle class="l" cx="200" cy="136" r="3.6" fill="#2E2118"/><circle class="l" cx="200" cy="158" r="3.6" fill="#2E2118"/><circle class="l" cx="200" cy="180" r="3.6" fill="#2E2118"/><circle class="l" cx="200" cy="202" r="3.6" fill="#2E2118"/><circle class="l" cx="200" cy="224" r="3.6" fill="#2E2118"/>
    <path d="M192 80 h16 M190 160 h20 M188 240 h24" stroke="#D2A94B" stroke-width="2.4"/>
    <path class="k" fill="#D2A94B" d="M186 258 L214 258 Q232 300 270 338 Q200 356 130 338 Q168 300 186 258 Z"/>
