    <rect class="l" x="187" y="114.6" width="26" height="5" rx="1" fill="#D9BE84"/>
    <rect class="l" x="187" y="129.8" width="26" height="5" rx="1" fill="#D9BE84"/>
    <rect class="l" x="187" y="143.6" width="26" height="5" rx="1" fill="#D9BE84"/>
