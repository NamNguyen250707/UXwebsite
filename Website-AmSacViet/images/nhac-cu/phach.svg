<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Phách. Minh họa vẽ mới cho dự án, phỏng theo phong cách tranh khắc gỗ dân gian.
       Sinh bởi scripts/draw-instruments.cjs — sửa ở script rồi chạy lại. -->
  <style>
    .k { stroke: #2E2118; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .l { stroke: #2E2118; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2E2118; stroke-width: 1.2; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <pattern id="diep" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1.3" fill="#FBF4E2"/><circle cx="22" cy="18" r="1" fill="#FBF4E2"/><circle cx="13" cy="29" r="0.8" fill="#E2CFA8"/>
    </pattern>
    <!-- Vân gỗ: các nét mảnh song song như vết khắc -->
    <pattern id="van" width="12" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q3 1.5 6 3 T12 3" fill="none" stroke="#2E2118" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#F1E4C6"/>
  <rect width="400" height="400" fill="url(#diep)"/>
  <ellipse cx="200" cy="302" rx="165" ry="12" fill="#E0CFA9"/>
  <g transform="rotate(-8 200 240)">
    <path class="k" fill="#D6BB78" d="M50 236 Q200 212 350 236 L350 262 Q200 282 50 262 Z"/>
    <path class="l" fill="#E4CC8E" d="M50 236 Q200 212 350 236 Q200 246 50 236 Z"/>
    <path d="M120 230 v34 M270 230 v34" stroke="#A8894A" stroke-width="3"/>
    <path class="t" d="M70 252 Q200 238 330 252" opacity="0.35"/>
    <rect class="k" x="50" y="262" width="300" height="8" rx="3" fill="#4A3518"/>
  </g>
  <path class="k" fill="none" d="M96 108 L262 214" style="stroke-width:8"/><path d="M96 108 L262 214" stroke="#8A5A34" stroke-width="4" stroke-linecap="round"/>
  <path class="k" fill="none" d="M128 96 L294 202" style="stroke-width:8"/><path d="M128 96 L294 202" stroke="#8A5A34" stroke-width="4" stroke-linecap="round"/>
  <path class="k" fill="none" d="M318 92 L178 206" style="stroke-width:8"/><path d="M318 92 L178 206" stroke="#B27A47" stroke-width="4" stroke-linecap="round"/>
</svg>
