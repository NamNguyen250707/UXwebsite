    <path class="k" fill="none" d="M182 58 L216 52 M182 86 L216 80"/>
    <circle class="l" cx="180" cy="58" r="5" fill="#D9BE84"/><circle class="l" cx="180" cy="86" r="5" fill="#D9BE84"/>
