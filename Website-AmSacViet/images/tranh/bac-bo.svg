<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <!-- Bắc Bộ: hát quan họ trên thuyền.
       Tranh vẽ mới cho dự án, phỏng theo phong cách tranh khắc gỗ dân gian
       (nét mực đậm, màu phẳng, nền giấy điệp). Không sao chép tác phẩm cụ thể.
       Nội dung chính nằm trong vùng y 45–315 vì khung hiển thị có thể cắt bớt mép trên/dưới. -->
  <style>
    .k { stroke: #2E2118; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .l { stroke: #2E2118; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2E2118; stroke-width: 1.3; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <!-- Giấy điệp: những chấm lấp lánh nhỏ -->
    <pattern id="diep" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1.3" fill="#FBF4E2"/>
      <circle cx="22" cy="18" r="1" fill="#FBF4E2"/>
      <circle cx="13" cy="29" r="0.8" fill="#E2CFA8"/>
    </pattern>
    <!-- Sóng nước kiểu khắc gỗ -->
    <pattern id="song" width="36" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q9 3 18 12 Q27 3 36 12" fill="none" stroke="#8FA6BD" stroke-width="1.5"/>
    </pattern>
    <!-- Lá tre -->
    <path id="la" d="M0 0 q12 -5 28 2 q-15 5 -28 -2z"/>
    <!-- Nét khắc: gạch chéo mảnh tạo bóng như vết dao khắc gỗ -->
    <pattern id="gan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 3.5 H7" stroke="#2E2118" stroke-width="0.7" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="300" height="360" fill="#F1E4C6"/>
  <rect width="300" height="360" fill="url(#diep)"/>

  <!-- Mặt trời đỏ son và đám mây -->
  <circle class="k" cx="206" cy="92" r="27" fill="#9E2A1C"/>
  <path class="k" fill="#FBF4E2" d="M60 96 q4 -16 22 -10 q8 -14 24 -4 q16 -4 16 10 q-4 10 -18 6 q-10 9 -24 2 q-16 6 -20 -4z"/>
  <path class="t" d="M78 94 q8 -6 16 0 M100 88 q6 -4 12 2"/>
  <!-- Đàn cò bay -->
  <path class="t" d="M132 66 q4 -4 8 0 q4 -4 8 0 M154 58 q3 -3 6 0 q3 -3 6 0 M142 76 q3 -3 6 0 q3 -3 6 0"/>

  <!-- Đồi vùng Kinh Bắc -->
  <path class="k" fill="#8C9663" d="M0 190 Q45 140 98 178 Q150 128 214 172 Q258 150 300 168 V240 H0Z"/>
  <path d="M0 190 Q45 140 98 178 Q150 128 214 172 Q258 150 300 168 V240 H0Z" fill="url(#gan)"/>
  <path class="k" fill="#5B7247" d="M0 212 Q70 184 128 208 Q200 186 300 204 V246 H0Z"/>
  <path d="M0 212 Q70 184 128 208 Q200 186 300 204 V246 H0Z" fill="url(#gan)"/>
  <!-- Cây đa đầu làng, rễ phụ rủ xuống -->
  <path class="k" fill="#6B4A2B" d="M150 206 Q147 184 151 166 L158 166 Q161 186 160 206Z"/>
  <path class="t" d="M140 168 q-2 14 0 28 M170 166 q3 14 1 30 M134 160 q-3 12 -1 22"/>
  <circle class="l" cx="138" cy="156" r="17" fill="#3F5434"/>
  <circle class="l" cx="174" cy="158" r="15" fill="#3F5434"/>
  <circle class="l" cx="156" cy="144" r="21" fill="#4B6340"/>
  <path class="t" d="M146 140 q6 -5 12 0 M160 150 q5 -4 10 0 M132 156 q5 -4 10 0" style="stroke:#8C9663"/>
  <path class="t" d="M150 152 l4 8 M170 146 l3 9 M190 154 l4 8 M236 168 l3 8 M262 164 l3 8"/>

  <!-- Mái đình cong trên đồi -->
  <g transform="translate(96 174)">
    <rect class="k" x="-17" y="0" width="34" height="16" fill="#6B4A2B"/>
    <path class="t" d="M-8 0 V16 M8 0 V16"/>
    <path class="k" fill="#4A3518" d="M-36 -6 Q-30 0 -24 0 L-18 -16 L18 -16 L24 0 Q30 0 36 -6 Q32 3 24 4 L-24 4 Q-32 3 -36 -6Z"/>
  </g>

  <!-- Sông -->
  <rect x="0" y="236" width="300" height="124" fill="#33506F"/>
  <rect x="0" y="236" width="300" height="124" fill="url(#song)"/>
  <path class="k" fill="none" d="M0 236 H300"/>

  <!-- Bụi tre bên trái -->
  <rect class="k" x="14" y="44" width="7" height="200" fill="#7A8A4E"/>
  <rect class="k" x="30" y="74" width="6" height="170" fill="#7A8A4E"/>
  <path class="t" d="M14 84h7M14 124h7M14 164h7M14 204h7M30 108h6M30 148h6M30 188h6"/>
  <g class="l" fill="#3F5434">
    <use href="#la" transform="translate(20 52) rotate(-20)"/>
    <use href="#la" transform="translate(20 64) rotate(28)"/>
    <use href="#la" transform="translate(18 58) rotate(200)"/>
    <use href="#la" transform="translate(34 82) rotate(-35)"/>
    <use href="#la" transform="translate(34 96) rotate(15)"/>
    <use href="#la" transform="translate(30 90) rotate(165)"/>
    <use href="#la" transform="translate(34 122) rotate(-12)"/>
  </g>

  <!-- Thuyền -->
  <path class="k" fill="#6B4A2B" d="M36 270 Q150 296 266 270 L254 290 Q150 312 48 290Z"/>
  <path class="t" style="stroke:#C9A15A" d="M58 282 Q150 302 244 282"/>
  <path class="t" style="stroke:#B9C7D4" d="M70 306 h30 M130 314 h44 M200 306 h34"/>

  <!-- Liền chị: áo đỏ, yếm vàng, nón quai thao -->
  <path class="k" fill="#9E2A1C" d="M104 278 L136 278 L130 238 L110 238Z"/>
  <path class="k" fill="#D2A94B" d="M114 238 L126 238 L124 262 L116 262Z"/>
  <circle class="k" cx="120" cy="229" r="8" fill="#E6C9A0"/>
  <ellipse class="k" cx="120" cy="220" rx="23" ry="5" fill="#D2A94B"/>
  <path class="t" d="M106 222 Q110 236 114 240 M134 222 Q130 236 126 240"/>

  <!-- Liền anh: áo the chàm, khăn xếp, chiếc ô -->
  <path class="k" fill="#26405E" d="M160 278 L192 278 L187 238 L165 238Z"/>
  <circle class="k" cx="176" cy="229" r="8" fill="#E6C9A0"/>
  <path class="k" fill="#2E2118" d="M167 225 Q176 215 185 225 L184 228 Q176 223 168 228Z"/>
  <path class="k" fill="none" d="M190 258 L204 206"/>
  <path class="k" fill="#2E2118" d="M200 222 L206 200 L208 224Z"/>
  <path class="t" d="M190 258 q-4 2 -6 -2"/>

  <!-- Người chống sào, đội nón lá -->
  <path class="k" fill="#7A5A3A" d="M226 276 L246 276 L242 246 L230 246Z"/>
  <circle class="k" cx="236" cy="240" r="6.5" fill="#E6C9A0"/>
  <path class="k" fill="#D9BE84" d="M221 238 L236 223 L251 238Z"/>
  <path class="k" fill="none" d="M262 214 L218 304"/>

</svg>
