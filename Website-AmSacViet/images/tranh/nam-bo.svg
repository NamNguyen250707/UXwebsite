<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <!-- Nam Bộ: đờn ca tài tử bên bờ sông miệt vườn (người đờn đàn kìm, người ca), hàng dừa, ghe.
       Tranh vẽ mới cho dự án, phỏng theo phong cách tranh khắc gỗ dân gian. -->
  <style>
    .k { stroke: #2E2118; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .l { stroke: #2E2118; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2E2118; stroke-width: 1.3; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <pattern id="diep" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1.3" fill="#FBF4E2"/>
      <circle cx="22" cy="18" r="1" fill="#FBF4E2"/>
      <circle cx="13" cy="29" r="0.8" fill="#E2CFA8"/>
    </pattern>
    <pattern id="song" width="36" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q9 3 18 12 Q27 3 36 12" fill="none" stroke="#8FA6BD" stroke-width="1.5"/>
    </pattern>
    <!-- Một tàu lá dừa (hướng sang phải, đầu lá rủ xuống) -->
    <path id="tau" d="M0 0 Q30 -20 66 6 Q32 -6 0 0Z"/>
    <!-- Nét khắc: gạch chéo mảnh tạo bóng như vết dao khắc gỗ -->
    <pattern id="gan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 3.5 H7" stroke="#2E2118" stroke-width="0.7" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="300" height="360" fill="#F1E4C6"/>
  <rect width="300" height="360" fill="url(#diep)"/>

  <!-- Mặt trời vàng -->
  <circle class="k" cx="190" cy="96" r="30" fill="#D2A94B"/>
  <!-- Đàn chim bay về -->
  <path class="t" d="M116 74 q4 -4 8 0 q4 -4 8 0 M138 66 q3 -3 6 0 q3 -3 6 0 M126 84 q3 -3 6 0 q3 -3 6 0"/>

  <!-- Vườn cây phía xa -->
  <path class="k" fill="#8C9663" d="M0 214 Q30 196 60 210 Q90 192 130 208 Q170 194 210 206 Q250 190 300 204 V240 H0Z"/>
  <path d="M0 214 Q30 196 60 210 Q90 192 130 208 Q170 194 210 206 Q250 190 300 204 V240 H0Z" fill="url(#gan)"/>

  <!-- Nhà lá -->
  <path class="k" fill="#8A6A44" d="M182 214 H246 V244 H182Z"/>
  <rect class="l" x="206" y="224" width="14" height="20" fill="#2E2118"/>
  <path class="k" fill="#B8975A" d="M172 216 L214 180 L256 216Z"/>
  <path class="t" d="M186 210 L212 186 M200 214 L216 190 M228 212 L214 188 M242 212 L218 190"/>

  <!-- Bờ sông -->
  <path class="k" fill="#5B7247" d="M0 238 Q150 228 300 240 V294 H0Z"/>

  <!-- Cây dừa bên trái -->
  <path class="k" fill="#7A5A3A" d="M38 294 Q44 200 78 112 L86 115 Q54 200 50 294Z"/>
  <g class="l" fill="#3F5434" transform="translate(82 112)">
    <use href="#tau" transform="rotate(-35)"/>
    <use href="#tau" transform="rotate(8)"/>
    <use href="#tau" transform="rotate(48)"/>
    <use href="#tau" transform="scale(-1 1) rotate(-35)"/>
    <use href="#tau" transform="scale(-1 1) rotate(8)"/>
    <use href="#tau" transform="scale(-1 1) rotate(48)"/>
    <circle cx="-4" cy="6" r="4.5" fill="#8C9663"/>
    <circle cx="5" cy="7" r="4.5" fill="#8C9663"/>
  </g>

  <!-- Cây dừa bên phải -->
  <path class="k" fill="#7A5A3A" d="M262 294 Q258 212 240 140 L248 138 Q268 212 272 294Z"/>
  <g class="l" fill="#3F5434" transform="translate(244 138) scale(0.85)">
    <use href="#tau" transform="rotate(-30)"/>
    <use href="#tau" transform="rotate(14)"/>
    <use href="#tau" transform="scale(-1 1) rotate(-30)"/>
    <use href="#tau" transform="scale(-1 1) rotate(14)"/>
    <use href="#tau" transform="scale(-1 1) rotate(50)"/>
    <circle cx="0" cy="6" r="4.5" fill="#8C9663"/>
  </g>

  <!-- Chiếu hoa -->
  <path class="k" fill="#C9A15A" d="M76 288 H206 L198 274 H86Z"/>
  <path class="t" style="stroke:#9E2A1C;stroke-width:1.6" d="M88 278 H196 M82 284 H202"/>

  <!-- Người đờn: áo bà ba chàm, khăn rằn, ôm đàn kìm -->
  <ellipse class="k" cx="112" cy="276" rx="24" ry="6" fill="#2E2118"/>
  <path class="k" fill="#26405E" d="M98 274 L126 274 L121 240 L103 240Z"/>
  <rect class="l" x="104" y="238" width="16" height="5" fill="#F1E4C6"/>
  <path class="t" d="M108 238 v5 M112 238 v5 M116 238 v5"/>
  <circle class="k" cx="112" cy="231" r="8" fill="#E6C9A0"/>
  <path class="k" fill="none" style="stroke-width:3.2" d="M134 252 L166 218"/>
  <rect class="l" x="163" y="212" width="8" height="6" fill="#4A3518" transform="rotate(-45 167 215)"/>
  <circle class="k" cx="130" cy="257" r="11" fill="#D2A94B"/>
  <circle cx="130" cy="257" r="2.4" fill="#2E2118"/>
  <path class="t" d="M121 248 L130 256"/>

  <!-- Người ca: áo bà ba đỏ, quần đen, búi tóc -->
  <path class="k" fill="#2E2118" d="M184 272 L198 272 L197 288 L185 288Z"/>
  <path class="k" fill="#9E2A1C" d="M182 272 L200 272 L198 238 L184 238Z"/>
  <circle class="k" cx="191" cy="230" r="7" fill="#E6C9A0"/>
  <circle class="l" cx="196" cy="225" r="3.5" fill="#2E2118"/>

  <!-- Sông -->
  <rect x="0" y="294" width="300" height="66" fill="#33506F"/>
  <rect x="0" y="294" width="300" height="66" fill="url(#song)"/>
  <path class="k" fill="none" d="M0 294 H300"/>

  <!-- Lục bình trôi -->
  <g class="l" fill="#5B7247">
    <ellipse cx="124" cy="340" rx="14" ry="5"/>
    <ellipse cx="146" cy="346" rx="10" ry="4"/>
  </g>
  <circle cx="122" cy="336" r="2" fill="#F1E4C6"/>
  <circle cx="128" cy="337" r="2" fill="#F1E4C6"/>
  <!-- Cầu khỉ: cây tre bắc ngang, chân cầu chéo hình chữ X, tay vịn -->
  <g>
    <path class="k" fill="none" style="stroke-width:3" d="M6 336 L40 282 M40 336 L6 282 M52 336 L86 282 M86 336 L52 282"/>
    <path fill="none" stroke="#D6BB78" stroke-width="1.6" d="M6 336 L40 282 M40 336 L6 282 M52 336 L86 282 M86 336 L52 282"/>
    <path class="k" fill="none" style="stroke-width:3.4" d="M0 312 L100 304"/>
    <path fill="none" stroke="#D6BB78" stroke-width="1.8" d="M0 312 L100 304"/>
    <path class="k" fill="none" d="M0 290 Q50 282 100 286"/>
  </g>

  <!-- Ghe và người chèo -->
  <path class="k" fill="#6B4A2B" d="M150 316 Q215 330 284 314 L276 326 Q215 342 158 326Z"/>
  <path class="k" fill="#7A5A3A" d="M250 318 L264 318 L262 298 L252 298Z"/>
  <circle class="k" cx="257" cy="292" r="5.5" fill="#E6C9A0"/>
  <path class="k" fill="#D9BE84" d="M245 291 L257 280 L269 291Z"/>
  <path class="k" fill="none" d="M244 300 L232 342"/>

</svg>
