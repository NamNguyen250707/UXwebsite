<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <!-- Trung Bộ: đêm trăng trên sông Hương, đò ca Huế, ngọn tháp bên bờ, đôi hạc bay.
       Tranh vẽ mới cho dự án, phỏng theo phong cách tranh khắc gỗ dân gian.
       Ngọn tháp và núi chỉ gợi tả, không phải bản vẽ kiến trúc chính xác.
       Phần đáy giữa tranh bị mặt trống che trên trang chủ nên để trống (chỉ có sóng). -->
  <style>
    .k { stroke: #2E2118; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .l { stroke: #2E2118; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #2E2118; stroke-width: 1.3; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <pattern id="diep" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1.3" fill="#FBF4E2"/>
      <circle cx="22" cy="18" r="1" fill="#FBF4E2"/>
      <circle cx="13" cy="29" r="0.8" fill="#E2CFA8"/>
    </pattern>
    <pattern id="song" width="36" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q9 3 18 12 Q27 3 36 12" fill="none" stroke="#8FA6BD" stroke-width="1.5"/>
    </pattern>
    <!-- Chim hạc bay (đầu quay sang trái) -->
    <g id="hac">
      <path class="l" fill="#FBF4E2" d="M-8 -6 C-2 -40 20 -58 44 -62 C34 -44 26 -24 14 -6Z"/>
      <path fill="#2E2118" d="M44 -62 C38 -52 34 -44 30 -36 L38 -42 Z"/>
      <ellipse class="l" cx="0" cy="0" rx="22" ry="8" fill="#FBF4E2"/>
      <path class="l" fill="#2E2118" d="M18 -3 L34 -7 L31 5Z"/>
      <path class="t" style="stroke-width:3" d="M-18 -3 Q-36 -14 -50 -8"/>
      <circle class="l" cx="-52" cy="-9" r="4" fill="#FBF4E2"/>
      <circle cx="-53" cy="-11" r="1.8" fill="#9E2A1C"/>
      <path class="l" fill="#D2A94B" d="M-55 -10 L-70 -5 L-55 -7Z"/>
      <path class="t" d="M18 2 L52 9 M18 4 L50 12"/>
    </g>
    <!-- Nét khắc: gạch chéo mảnh tạo bóng như vết dao khắc gỗ -->
    <pattern id="gan" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 3.5 H7" stroke="#2E2118" stroke-width="0.7" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="300" height="360" fill="#F1E4C6"/>
  <rect width="300" height="360" fill="url(#diep)"/>

  <!-- Trăng tròn -->
  <circle class="k" cx="220" cy="76" r="26" fill="#E9CF86"/>
  <!-- Mây vắt ngang trăng -->
  <path class="k" fill="#FBF4E2" d="M232 96 q4 -10 16 -6 q8 -8 18 0 q10 0 8 9 q-6 6 -16 3 q-8 6 -18 0 q-10 2 -8 -6z"/>
  <path class="t" d="M246 94 q6 -4 12 0"/>

  <!-- Đôi hạc -->
  <use href="#hac" transform="translate(100 92) scale(0.62)"/>
  <use href="#hac" transform="translate(148 116) scale(0.46)"/>

  <!-- Núi xa và núi đỉnh bằng như bức bình phong -->
  <path class="k" fill="#A9AE84" d="M120 168 Q160 138 196 148 Q240 130 300 148 V200 H120Z"/>
  <path d="M120 168 Q160 138 196 148 Q240 130 300 148 V200 H120Z" fill="url(#gan)"/>
  <path class="k" fill="#6F8452" d="M150 180 Q166 156 190 152 H246 Q272 156 290 180 V200 H150Z"/>
  <path d="M150 180 Q166 156 190 152 H246 Q272 156 290 180 V200 H150Z" fill="url(#gan)"/>
  <path class="t" d="M200 152 l3 -7 l3 7 M222 151 l3 -7 l3 7 M240 152 l3 -7 l3 7"/>

  <!-- Bờ sông -->
  <path class="k" fill="#5B7247" d="M0 186 Q80 178 150 190 Q220 182 300 192 V206 H0Z"/>

  <!-- Ngọn tháp bảy tầng (gợi tả) -->
  <g>
    <circle class="l" cx="44" cy="180" r="12" fill="#3F5434"/>
    <circle class="l" cx="98" cy="181" r="11" fill="#3F5434"/>
    <rect class="k" x="55" y="173" width="30" height="13" fill="#DCC9A0"/>
    <rect class="k" x="56.5" y="160" width="27" height="13" fill="#DCC9A0"/>
    <rect class="k" x="58" y="147" width="24" height="13" fill="#DCC9A0"/>
    <rect class="k" x="59.5" y="134" width="21" height="13" fill="#DCC9A0"/>
    <rect class="k" x="61" y="121" width="18" height="13" fill="#DCC9A0"/>
    <rect class="k" x="62.5" y="108" width="15" height="13" fill="#DCC9A0"/>
    <rect class="k" x="64" y="95" width="12" height="13" fill="#DCC9A0"/>
    <g class="l" fill="#4A3518">
      <rect x="51" y="171" width="38" height="3.5"/>
      <rect x="52.5" y="158" width="35" height="3.5"/>
      <rect x="54" y="145" width="32" height="3.5"/>
      <rect x="55.5" y="132" width="29" height="3.5"/>
      <rect x="57" y="119" width="26" height="3.5"/>
      <rect x="58.5" y="106" width="23" height="3.5"/>
      <rect x="60" y="93" width="20" height="3.5"/>
    </g>
    <rect x="66" y="177" width="8" height="9" fill="#9E2A1C"/>
    <path class="k" fill="none" d="M70 93 V76"/>
    <circle class="l" cx="70" cy="82" r="2.5" fill="#D2A94B"/>
  </g>

  <!-- Sông Hương -->
  <rect x="0" y="200" width="300" height="160" fill="#33506F"/>
  <rect x="0" y="200" width="300" height="160" fill="url(#song)"/>
  <path class="k" fill="none" d="M0 200 H300"/>
  <!-- Bóng trăng trên mặt nước -->
  <path d="M206 262 h28 M212 274 h16 M208 286 h24" stroke="#E9CF86" stroke-width="3" stroke-linecap="round"/>
  <!-- Bóng đèn lồng -->
  <path d="M124 248 h12 M126 256 h8" stroke="#C0574A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Lá sen và nụ sen sát bờ -->
  <g class="l">
    <ellipse cx="34" cy="216" rx="20" ry="6" fill="#5B7247"/>
    <ellipse cx="72" cy="226" rx="16" ry="5" fill="#4B6340"/>
    <ellipse cx="20" cy="236" rx="13" ry="4" fill="#5B7247"/>
  </g>
  <path class="t" d="M34 216 l-8 -2 M72 226 l6 -2" style="stroke:#8C9663"/>
  <path class="t" d="M52 214 v-16"/>
  <path class="l" fill="#D98A7A" d="M52 198 q-6 -8 0 -16 q6 8 0 16z"/>

  <!-- Đò có mui, treo đèn lồng -->
  <path class="k" fill="#6B4A2B" d="M112 226 Q178 244 252 226 L244 238 Q178 256 120 238Z"/>
  <path class="k" fill="#8A6A44" d="M140 230 Q142 204 170 202 Q198 204 202 232Z"/>
  <path class="t" d="M152 230 Q154 214 170 212 Q186 214 190 232"/>
  <path class="t" d="M140 216 H130 V222"/>
  <ellipse class="k" cx="130" cy="229" rx="5" ry="7" fill="#9E2A1C"/>
  <path d="M126 222 h8 M126 236 h8" stroke="#D2A94B" stroke-width="2"/>

  <!-- Người chèo đò -->
  <path class="k" fill="#26405E" d="M228 230 L244 230 L241 204 L231 204Z"/>
  <circle class="k" cx="236" cy="198" r="6" fill="#E6C9A0"/>
  <path class="k" fill="#D9BE84" d="M222 196 L236 182 L250 196Z"/>
  <path class="k" fill="none" d="M250 190 L264 252"/>

</svg>
